[package]
name = "snapshot-interpolator"
description = "Facilitates the smooth realtime playback of snapshots which have been inserted into a buffer out-of-order, with latency or with jitter."
version = "1.0.1"
edition = "2024"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/Serophots/snapshot-interpolator"
keywords = ["gamedev", "network"]

[lints.rust]
unused_crate_dependencies = "warn"

[lints.clippy]
arithmetic_side_effects = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
unwrap_used = "warn"
unchecked_time_subtraction = "warn"

[dependencies]
num-traits = "0.2"
